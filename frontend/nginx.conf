server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # За Caddy и docker-сетью настоящий IP жителя приходит в X-Forwarded-For.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types application/wasm text/css application/javascript application/json image/svg+xml;

    # Остальные запросы к API — JSON, им хватает мегабайта; файлы принимают только два адреса.
    client_max_body_size 1m;

    location ^~ /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    location = /api/photos {
        client_max_body_size 6m;
        include /etc/nginx/api-proxy.conf;
    }

    location = /api/receipts {
        client_max_body_size 12m;
        include /etc/nginx/api-proxy.conf;
    }

    # Ответы ассистента идут потоком: буферизация сломала бы стриминг.
    location ^~ /api/assistant/ {
        include /etc/nginx/api-proxy.conf;
        proxy_buffering off;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Запросы к несуществующим файлам (/favicon.ico, /x.png) получают 404, а не index.html.
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    # SPA-фолбэк только для путей без расширения.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
