# Частые вопросы: показываются вместо ассистента, когда языковая модель не подключена.
# basis — нормы как в rules.yaml; verified: false — реквизит не сверен с текстом документа.
- id: where_to_complain
  question: "Куда жаловаться на управляющую компанию?"
  answer: >-
    Сначала подайте письменное обращение в саму управляющую компанию и сохраните номер или
    отметку о приёме. Если срок ответа прошёл или ответ не устроил, пишите в Государственную
    жилищную инспекцию Приморского края, затем в прокуратуру. Подать обращение можно через
    «Решаем вместе»: оно попадёт к адресату и получит срок ответа.
  basis:
    - { text: "Порядок рассмотрения обращений граждан", source: "59-ФЗ", verified: false }
    - { text: "Содержание общего имущества многоквартирного дома — обязанность управляющей организации", source: "ПП РФ № 491", verified: false }
- id: response_deadlines
  question: "В какие сроки обязаны ответить на обращение?"
  answer: >-
    По вопросам качества услуг и содержания дома управляющая компания отвечает в течение
    10 рабочих дней. Государственные органы (ГЖИ, администрация, прокуратура) отвечают
    в течение 30 календарных дней. Срок считается со дня, когда обращение зарегистрировано.
    В «Ладно» после отметки «Подал» запускается отсчёт срока и приходит напоминание.
  basis:
    - { text: "Срок рассмотрения обращения исполнителем коммунальных услуг", source: "ПП РФ № 354", verified: false }
    - { text: "Срок рассмотрения обращения государственным органом", source: "59-ФЗ", verified: false }
- id: flooding
  question: "Что делать, если затопило квартиру?"
  answer: >-
    Если вода попала на электропроводку или угрожает людям, обесточьте квартиру и звоните 112. Перекройте воду, вызовите
    аварийную службу управляющей компании и потребуйте составить акт о заливе: в нём указывают
    причину, место течи и ущерб. Сфотографируйте повреждения и сохраните акт: по нему возмещают
    ущерб. Если течь на стояке до первого крана, отвечает управляющая компания, а если
    в квартире соседей или после крана — владелец этой квартиры.
  basis:
    - { text: "Стояки и ответвления до первого отключающего устройства входят в общее имущество МКД", source: "ПП РФ № 491", verified: false }
    - { text: "Акт о причинении ущерба составляется исполнителем по заявлению потребителя", source: "ПП РФ № 354", verified: false }
    - { text: "Собственник несёт бремя содержания своего имущества", source: "ГК РФ, ст. 210", verified: false }
- id: emergency
  question: "Куда звонить при аварии: газ, искрит проводка, обрушение?"
  answer: >-
    Единый номер экстренных служб: 112. Диспетчер ЕДДС Владивостока: +7 423 222-23-33.
    При запахе газа не включайте свет и электроприборы, откройте окна и выйдите из квартиры;
    звоните уже с улицы. Аварийный телефон управляющей компании указан на квитанции
    и на подъезде.
  basis:
    - { text: "Аварийные заявки принимаются круглосуточно и выполняются безотлагательно", source: "ПП РФ № 354", verified: false }
- id: read_receipt
  question: "Как читать квитанцию?"
  answer: >-
    В квитанции строки по услугам: содержание жилья, вода, водоотведение, отопление, электричество,
    вывоз мусора, капитальный ремонт. У каждой строки есть объём (по счётчику или нормативу),
    тариф и сумма к оплате; объём умножается на тариф. Отдельно смотрите перерасчёты и итог.
    Загрузите квитанцию или введите её вручную: «Ладно» объяснит каждую строку и проверит
    начисления по тарифам региона.
  basis:
    - { text: "Состав платёжного документа и порядок расчёта платы за коммунальные услуги", source: "ПП РФ № 354", verified: false }
- id: recalculation
  question: "Как получить перерасчёт?"
  answer: >-
    Найдите в квитанции строку, где что-то не сходится: тариф выше утверждённого, начисление
    по нормативу вместо счётчика, повторяющаяся строка. Подайте в управляющую компанию заявление
    с просьбой пересчитать плату и приложите квитанцию. Если за услугу вы платите по счётчику,
    передавайте показания каждый месяц до даты, указанной в квитанции. Заявление на перерасчёт
    «Ладно» составит по результатам проверки квитанции.
  basis:
    - { text: "Перерасчёт платы за коммунальные услуги по заявлению потребителя", source: "ПП РФ № 354", verified: false }
- id: increased_coefficient
  question: "Что такое повышающий коэффициент и как его убрать?"
  answer: >-
    Если счётчика нет, у него истёк срок поверки или показания не передаются, начисление идёт
    по нормативу, а к нему могут применять повышающий коэффициент 1,5. Убрать его можно, поставив
    или поверив счётчик и передав показания: после этого плата считается по фактическому
    потреблению. Если коэффициент применили, хотя счётчик исправен, просите перерасчёт.
  basis:
    - { text: "Порядок применения повышающего коэффициента к нормативу при расчёте платы", source: "ПП РФ № 354", verified: false }
- id: housing_inspection
  question: "Что такое ГЖИ и когда в неё писать?"
  answer: >-
    Государственная жилищная инспекция проверяет управляющие компании: содержание дома,
    начисления, ответы на обращения. Пишите в ГЖИ, если управляющая компания не ответила
    в срок, отказала без причин или нарушает правила. Приложите копию первого обращения, фото
    и квитанцию. Ответ придёт в течение 30 календарных дней.
  basis:
    - { text: "Государственный жилищный надзор за деятельностью управляющих организаций", source: "ЖК РФ, ст. 20", verified: false }
    - { text: "Срок рассмотрения обращения государственным органом", source: "59-ФЗ", verified: false }
- id: pos
  question: "Как подать обращение через «Решаем вместе»?"
  answer: >-
    Откройте готовое обращение в «Ладно», нажмите «Подать через "Решаем вместе"»: откроется
    платформа, где текст нужно вставить в форму и выбрать рубрику, которую мы подскажем.
    Номер обращения с платформы запишите в «Ладно», чтобы отслеживать срок ответа.
  basis:
    - { text: "Порядок рассмотрения обращений граждан", source: "59-ФЗ", verified: false }
- id: attachments
  question: "Что приложить к обращению?"
  answer: >-
    Фото проблемы (до трёх), адрес и точное место: подъезд, этаж, квартира. Если это
    повторное обращение, приложите номер и дату первого. При спорах о начислениях приложите
    квитанцию. Чем конкретнее описание, тем сложнее отписаться формально.
  basis:
    - { text: "Обращение должно содержать суть вопроса и адрес для ответа", source: "59-ФЗ", verified: false }
- id: second_appeal
  question: "Управляющая компания не отвечает. Что дальше?"
  answer: >-
    Если срок прошёл, отметьте это в обращении: «Ладно» подготовит жалобу в ГЖИ с ссылкой
    на первое обращение. Если проблема опасна (газ, затопление, искрение), не ждите срока
    и звоните в аварийную службу или по 112.
  basis:
    - { text: "Срок рассмотрения обращения исполнителем коммунальных услуг", source: "ПП РФ № 354", verified: false }
    - { text: "Срок рассмотрения обращения государственным органом", source: "59-ФЗ", verified: false }
