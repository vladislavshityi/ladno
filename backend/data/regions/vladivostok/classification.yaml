# Признаки аварии: любое совпадение с текстом обращения — is_emergency. Сопоставление по подстрокам.
# addressees — чьи телефоны показать, advice — что сделать прямо сейчас.
emergency:
  - reason: "Возможная утечка газа"
    keywords: [запах газа, пахнет газом, утечка газа, утечку газа]
    addressees: [gas_emergency, edds]
    advice: "Не включайте свет и электроприборы, откройте окна, выйдите из помещения и звоните с улицы."
  - reason: "Искрение или оголённые провода"
    keywords: [искр, оголённ, оголенн]
    addressees: [edds]
    advice: "Не трогайте провода и держитесь на расстоянии. Если искрит в квартире, выключите автоматы в щитке."
  - reason: "Затопление"
    keywords: [затопил, затопление, топит, топим, заливает, заливаем, залили, залил, хлещет вода, прорыв трубы, прорвало]
    addressees: [edds]
    advice: "Перекройте воду краном на вводе в квартиру и вызовите аварийно-диспетчерскую службу вашей УК: её телефон есть в квитанции и в профиле дома."
  - reason: "Угроза обрушения"
    keywords: [обрушени, обрушил, рухнул, рушится]
    addressees: [edds]
    advice: "Отойдите в безопасное место и не пускайте людей в опасную зону."
  - reason: "Открытый люк на проезжей части"
    keywords: [открытый люк, открытом люке, нет крышки люка, без крышки люк]
    addressees: [edds]
    advice: "Если можете безопасно, обозначьте люк заметным предметом."
# Если аварию заметила только модель: общие экстренные телефоны.
emergency_addressees: [edds]
