# Признаки аварии: любое совпадение с текстом обращения — is_emergency. Сопоставление по подстрокам.
emergency:
  - reason: "Возможная утечка газа"
    keywords: [запах газа, пахнет газом, утечка газа, утечку газа]
  - reason: "Искрение или оголённые провода"
    keywords: [искр, оголённ, оголенн]
  - reason: "Затопление"
    keywords: [затопил, затопление, топит, хлещет вода, прорыв трубы]
  - reason: "Угроза обрушения"
    keywords: [обрушени, обрушил, рухнул, рушится]
  - reason: "Открытый люк на проезжей части"
    keywords: [открытый люк, открытом люке, нет крышки люка, без крышки люк]
# Адресаты из addressees.yaml: их телефоны показываются при аварии.
emergency_addressees: [edds, gas_emergency]
