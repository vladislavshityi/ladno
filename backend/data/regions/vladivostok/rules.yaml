# Первое совпавшее правило побеждает; `default` обязателен для каждой категории.
# Все нормы verified: false — человек сверяет с первоисточником перед демо.
stairwell_lighting:
  questions:
    - id: duration
      text: "Как давно нет света?"
      options:
        - { value: days_few, label: "Несколько дней" }
        - { value: week_plus, label: "Больше недели" }
    - id: scope
      text: "Что именно не работает?"
      options:
        - { value: one_lamp, label: "Одна лампа" }
        - { value: floor, label: "Освещение на этаже" }
        - { value: whole_entrance, label: "Во всём подъезде" }
  routes:
    - when: { scope: whole_entrance }
      addressee: managing_company
      explanation: "Освещение всего подъезда — общее имущество, содержит УК; ситуация требует быстрого устранения."
      basis:
        - { text: "Освещение мест общего пользования входит в состав общего имущества МКД", source: "ПП РФ № 491", verified: false }
        - { text: "Обеспечение освещения подъездов — обязанность управляющей организации", source: "ПП РФ № 290", verified: false }
      response_deadline: { days: 10, type: working, source: "ПП РФ № 354", verified: false }
      fix_deadline: { days: 1, type: calendar, source: "ПП РФ № 290", verified: false }
      escalation: [housing_inspection, prosecutor]
    - when: { duration: week_plus }
      addressee: managing_company
      explanation: "Лампы не заменяют больше недели — это нарушение сроков устранения неисправностей, можно сразу требовать ответа и ссылаться на ГЖИ."
      basis:
        - { text: "Освещение мест общего пользования — общее имущество МКД", source: "ПП РФ № 491", verified: false }
        - { text: "Замена перегоревших ламп в местах общего пользования — в течение 3 суток", source: "ПП РФ № 290", verified: false }
      response_deadline: { days: 10, type: working, source: "ПП РФ № 354", verified: false }
      fix_deadline: { days: 3, type: calendar, source: "ПП РФ № 290", verified: false }
      escalation: [housing_inspection, prosecutor]
    - when: { scope: [one_lamp, floor] }
      addressee: managing_company
      explanation: "Замена ламп в подъезде — обязанность УК."
      basis:
        - { text: "Освещение мест общего пользования — общее имущество МКД", source: "ПП РФ № 491", verified: false }
      response_deadline: { days: 10, type: working, source: "ПП РФ № 354", verified: false }
      fix_deadline: { days: 7, type: calendar, source: "ПП РФ № 290", verified: false }
      escalation: [housing_inspection, prosecutor]
  default:
    addressee: managing_company
    explanation: "Освещение подъезда содержит управляющая организация."
    basis:
      - { text: "Освещение мест общего пользования — общее имущество МКД", source: "ПП РФ № 491", verified: false }
    response_deadline: { days: 10, type: working, source: "ПП РФ № 354", verified: false }
    escalation: [housing_inspection, prosecutor]

graffiti:
  questions:
    - id: place
      text: "Где находится граффити?"
      options:
        - { value: entrance, label: "В подъезде" }
        - { value: house_facade, label: "На фасаде дома" }
        - { value: stop, label: "На остановке" }
        - { value: city_object, label: "На другом городском объекте" }
  routes:
    - when: { place: [entrance, house_facade] }
      addressee: managing_company
      explanation: "Подъезд и фасад дома — общее имущество, за чистоту отвечает УК."
      basis:
        - { text: "Фасады и стены подъездов — общее имущество МКД", source: "ПП РФ № 491", verified: false }
        - { text: "Поддержание надлежащего внешнего вида фасадов", source: "ПП РФ № 170", verified: false }
      response_deadline: { days: 10, type: working, source: "ПП РФ № 354", verified: false }
      escalation: [housing_inspection, police]
    - when: { place: [stop, city_object] }
      addressee: city_admin
      explanation: "Остановки и городские объекты находятся в ведении города."
      basis:
        - { text: "Благоустройство территории — полномочие городского округа", source: "131-ФЗ", verified: false }
        - { text: "Правила благоустройства Владивостока", source: "Решение Думы г. Владивостока", verified: false }
      response_deadline: { days: 30, type: calendar, source: "59-ФЗ", verified: false }
      escalation: [police, prosecutor]
  default:
    addressee: pos
    explanation: "Не удалось определить ответственного — отправьте через «Решаем вместе»."
    basis: []
    response_deadline: { days: 30, type: calendar, source: "59-ФЗ", verified: false }
    escalation: [prosecutor]

