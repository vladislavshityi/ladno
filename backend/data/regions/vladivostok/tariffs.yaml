# Тарифы для населения Владивостока на 2026 год (цены с НДС, 22%).
# Меняются два раза: с 1 января (НДС) и с 1 октября (плановая индексация, перенесена с июля).
#
# У каждого периода: value (строкой), document, source_url, verified.
# verified: true — значение прочитано в тексте постановления.
# verified: false — значение подтверждено только вторичными источниками (новости, агрегаторы)
# либо первоисточник не открылся; в note сказано, что именно проверено.
# Сводка по значениям и ссылкам собиралась вручную 2026-11-13.
#
# unit — единица объёма в строке квитанции; price_unit — единица, в которой утверждён тариф.
# volume_factor: тариф в единицах квитанции = value * volume_factor (для ТКО: тариф утверждён
# за м3 отходов, а в квитанции начисление идёт за м2 площади по нормативу накопления).
# variant: у электроэнергии разные тарифы для домов с газовыми и электрическими плитами;
# проверка принимает любой из вариантов.

service_notes:
  maintenance: >-
    Содержание и текущий ремонт общего имущества дома: уборка, лифты, освещение подъездов,
    аварийная служба. Считается как площадь × ставка за м2; ставку утверждают собственники
    на общем собрании.
  cold_water: >-
    Холодная вода для кухни, ванной и туалета. Зависит от показаний счётчика
    (без счётчика берётся норматив на каждого проживающего) и от тарифа.
  hot_water: >-
    Горячая вода из крана: плата за воду и за её нагрев. Зависит от показаний счётчика
    (без счётчика берётся норматив) и от тарифа.
  hot_water_heat: >-
    Нагрев воды для горячего водоснабжения. Зависит от объёма горячей воды и тарифа
    на тепловую энергию.
  sewerage: >-
    Отвод стоков. Объём равен сумме холодной и горячей воды, тариф свой.
  heating: >-
    Тепло в квартире. Зависит от погоды и длины отопительного сезона, от площади
    и от тарифа за гигакалорию; в отопительный сезон начисления заметно больше.
  electricity: >-
    Электричество по показаниям счётчика. Зависит от потреблённых киловатт-часов
    и от тарифа (для домов с газовой или электрической плитой тарифы разные).
  gas: >-
    Газ для плиты или отопления: по счётчику или нормативу, умноженным на тариф за кубометр.
  waste: >-
    Вывоз мусора. Считается по площади квартиры: площадь × норматив накопления × тариф
    регионального оператора, показания счётчиков не нужны.
  capital_repair: >-
    Взнос на капитальный ремонт дома: площадь × минимальная ставка, которую утверждает край.
  common_property_resources: >-
    Электричество, вода и тепло на общие нужды дома (подъезды, лифты, двор).
    Зависит от показаний общедомовых счётчиков и тарифов.
  intercom: "Обслуживание домофона: фиксированная ежемесячная плата."
  other: "Прочие начисления: смотрите название строки в квитанции."

# Нормы, на которые ссылается заявление на перерасчёт, по типам находок проверки квитанции.
# verified: false — реквизит не сверен с текстом документа; в заявлении он помечается.
finding_basis:
  tariff_mismatch:
    - { text: "Плата за коммунальные услуги рассчитывается по тарифам, установленным органом регулирования", source: "ПП РФ № 354", verified: false }
  norm_instead_of_meter:
    - { text: "Плата за коммунальные услуги рассчитывается по показаниям индивидуального прибора учёта", source: "ПП РФ № 354", verified: false }
  norm_increased:
    - { text: "Порядок применения повышающего коэффициента к нормативу при расчёте платы", source: "ПП РФ № 354", verified: false }
  duplicate_line:
    - { text: "Плата начисляется один раз за фактически оказанную услугу", source: "ПП РФ № 354", verified: false }
  unexplained_recalculation:
    - { text: "Исполнитель обязан указывать в платёжном документе основания и размер перерасчёта", source: "ПП РФ № 354", verified: false }

